name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      # Key off the GitHub release rather than the tag: the tag is pushed before
      # the release job runs, so a failed release would otherwise leave a tag that
      # blocks every retry. Re-run with workflow_dispatch after fixing a failure.
      - name: Check for new version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version package.json)
          TAG="v${VERSION}"
          # Only a definite "release not found" means release. Any other failure
          # (API outage, rate limit, auth) must fail the run rather than rebuild and
          # overwrite an already-published release's assets.
          if OUT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" 2>&1); then
            echo "Release $TAG already exists, skipping release"
            echo "release=false" >> $GITHUB_OUTPUT
          elif echo "$OUT" | grep -q "release not found"; then
            echo "No release for $VERSION yet, releasing"
            echo "release=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "::error::Could not check for an existing $TAG release: $OUT"
            exit 1
          fi

      - name: Create and push tag
        if: steps.check.outputs.release == 'true'
        run: |
          TAG="v${{ steps.check.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            # Retrying a failed release: the release job builds from the tag, so the
            # released code is exactly what was originally tagged
            TAG_VERSION=$(git show "$TAG:package.json" | jq -r .version)
            if [ "$TAG_VERSION" != "${{ steps.check.outputs.version }}" ]; then
              echo "::error::Tag $TAG has package.json version $TAG_VERSION; refusing to release it"
              exit 1
            fi
            echo "Tag $TAG already exists at $(git rev-list -n 1 "$TAG"), reusing it"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.release == 'true'
    permissions:
      contents: write
      discussions: write
    runs-on: ubuntu-latest
    env:
      GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
      ROOT_URL: ${{ secrets.ROOT_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.check-version.outputs.version }}

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Go environment
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: npm ci

      - name: Build and test frontend
        run: npm run build

      - name: Warn missing Grafana access policy token
        run: |
          echo Please generate a Grafana access policy token: https://grafana.com/docs/grafana/latest/developers/plugins/sign-a-plugin/#generate-a-token
          echo Once done please follow the instructions found here: https://github.com/${{github.repository}}/blob/main/README.md#using-github-actions-release-workflow
        if: ${{ env.GRAFANA_ACCESS_POLICY_TOKEN == '' }}

      # Pinned: sign-plugin 4.x requires Node >= 24.5, and @latest silently broke releases
      - name: Sign plugin
        run: npx @grafana/sign-plugin@3.3.3 --rootUrls "$ROOT_URL"
        if: ${{ env.GRAFANA_ACCESS_POLICY_TOKEN != '' }}

      - name: Get plugin metadata
        id: metadata
        run: |
          GRAFANA_PLUGIN_ID=$(jq -r .id dist/plugin.json)
          GRAFANA_PLUGIN_VERSION=$(jq -r .info.version dist/plugin.json)
          GRAFANA_PLUGIN_ARTIFACT=${GRAFANA_PLUGIN_ID}-${GRAFANA_PLUGIN_VERSION}.zip
          GRAFANA_PLUGIN_ARTIFACT_CHECKSUM=${GRAFANA_PLUGIN_ARTIFACT}.md5

          echo "plugin-id=${GRAFANA_PLUGIN_ID}" >> $GITHUB_OUTPUT
          echo "archive=${GRAFANA_PLUGIN_ARTIFACT}" >> $GITHUB_OUTPUT
          echo "archive-checksum=${GRAFANA_PLUGIN_ARTIFACT_CHECKSUM}" >> $GITHUB_OUTPUT

      - name: Read changelog
        run: awk '/^## / {s++} s == 1 {print}' CHANGELOG.md > release_notes.md

      - name: Package plugin
        run: |
          mv dist ${{ steps.metadata.outputs.plugin-id }}
          zip ${{ steps.metadata.outputs.archive }} ${{ steps.metadata.outputs.plugin-id }} -r
          md5sum ${{ steps.metadata.outputs.archive }} > ${{ steps.metadata.outputs.archive-checksum }}

      - name: Validate plugin
        run: |
          go install github.com/grafana/plugin-validator/pkg/cmd/plugincheck2@latest
          plugincheck2 -config <(curl -s https://raw.githubusercontent.com/grafana/plugin-validator/main/config/default.yaml) ${{ steps.metadata.outputs.archive }}

      - name: Create Github release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          draft: false
          generate_release_notes: true
          body_path: release_notes.md
          files: |
            ./${{ steps.metadata.outputs.archive }}
            ./${{ steps.metadata.outputs.archive-checksum }}
